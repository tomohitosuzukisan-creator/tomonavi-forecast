# Streamlit Community Cloud は12時間アクセスがないとアプリを休止する。
# 休止中は訪問者に「Yes, get this app back up!」の画面が出て、起動まで20〜30秒待たされる。
# note記事からの読者を入口で取りこぼさないよう、4時間おきに実際のブラウザで訪問して起こしておく。
#
# 重要: 単純なHTTPリクエスト(curl等)では起こせない。Streamlitは
# JS実行 → WebSocket接続(/_stcore/stream) で初めてPythonプロセスが起動するため、
# ヘッドレスブラウザで実際にページを開き、必要なら復帰ボタンを押す必要がある。
#
# ブラウザは公式Playwrightイメージ同梱のものを使う。以前は毎回
# `playwright install --with-deps` で導入していたが、この工程が20分の上限に
# 達しても終わらず打ち切られたため、導入自体をなくした。
name: keep-alive

on:
  schedule:
    # 4時間おき(1日6回)。休止は12時間なので、1〜2回失敗しても間に合う余裕をとっている
    - cron: "0 */4 * * *"
  workflow_dispatch: # 手動実行用

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ブラウザ本体とOS依存パッケージが導入済みの公式イメージ
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      # イメージにブラウザは入っているが、`python` から playwright ライブラリを
      # import できず ModuleNotFoundError で落ちた(2026-08-19)。
      # インタプリタを python3 に固定し、無ければ入れる。
      # ブラウザは PLAYWRIGHT_BROWSERS_PATH 配下に既にあるため再ダウンロードは起きず、数秒で終わる
      - name: Ensure playwright package
        run: python3 -m pip install --break-system-packages --no-cache-dir playwright==1.62.0

      - name: Visit app and wake it if sleeping
        # 想定は3分以内。超えたらどの工程で滞留したか切り分けられるよう区切っておく
        timeout-minutes: 8
        run: python3 .github/scripts/keep_alive.py
        env:
          APP_URL: https://tomonavi-forecast.streamlit.app/
