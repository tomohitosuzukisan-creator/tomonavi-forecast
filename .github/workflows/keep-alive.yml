# Streamlit Community Cloud は12時間アクセスがないとアプリを休止する。
# 休止中は訪問者に「Yes, get this app back up!」の画面が出て、起動まで20〜30秒待たされる。
# note記事からの読者を入口で取りこぼさないよう、4時間おきに実際のブラウザで訪問して起こしておく。
#
# 重要: 単純なHTTPリクエスト(curl等)では起こせない。Streamlitは
# JS実行 → WebSocket接続(/_stcore/stream) で初めてPythonプロセスが起動するため、
# ヘッドレスブラウザで実際にページを開き、必要なら復帰ボタンを押す必要がある。
#
# ブラウザは公式のPlaywrightイメージに同梱されているものを使う。
# 以前は毎回 `playwright install --with-deps` で導入していたが、この工程が
# 20分の上限に達しても終わらず実行が打ち切られたため、導入自体をなくした。
name: keep-alive

on:
  # 定期実行は一時停止中(2026-08-19)。
  # コンテナ化で滞留は解消したが、スクリプトが exit 1 で終わる原因が未特定。
  # そのままにすると失敗通知メールが4時間おきに届き続けるため、原因を特定するまで止める。
  # 復旧手順: 下のコメントを外すだけ。手動実行(workflow_dispatch)は今も使える。
  # schedule:
  #   - cron: "0 */4 * * *"  # 4時間おき(1日6回)。休止は12時間なので余裕がある
  workflow_dispatch: # 手動実行用

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ブラウザと依存パッケージが導入済みの公式イメージ。導入を待つ必要がない
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Visit app and wake it if sleeping
        # 想定は3分以内。超えたらどの工程で滞留したか切り分けられるよう区切っておく
        timeout-minutes: 8
        run: python .github/scripts/keep_alive.py
        env:
          APP_URL: https://tomonavi-forecast.streamlit.app/
